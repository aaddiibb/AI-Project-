<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samurai Rig Test</title>
<style>
  :root { --ink: #1b1a22; --panel: #f6f2e9; --line: #cfc6b3; --accent: #8f1d2c; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 system-ui, sans-serif; color: var(--ink); background: #e9e4d8; }
  header { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  .group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  button { font: inherit; padding: 4px 9px; border: 1px solid var(--line); background: #fff; border-radius: 4px; cursor: pointer; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
  #stage { position: relative; width: 100%; height: calc(100vh - 120px); min-height: 480px;
    background: linear-gradient(#bfe1f2 0%, #e9f1ea 55%, #f4e3bd 100%); }
  #stage canvas { display: block; }
  #info { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: #4a4030; background: #fff8; padding: 3px 7px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>Samurai rig test</h1>
  <div class="group"><b>action</b><span id="actions" class="group"></span></div>
  <label><b>pose</b> <select id="poses"><option value="">(action)</option></select></label>
  <div class="group">
    <label><input type="checkbox" id="springs" checked> springs</label>
    <label><input type="checkbox" id="stepped"> stepped (on 3s)</label>
    <label><input type="checkbox" id="stress"> joint stress test</label>
    <label><input type="checkbox" id="mirror"> mirror</label>
    <label><input type="checkbox" id="pivots"> pivots</label>
    <label><input type="checkbox" id="hitboxes" checked> hit / hurt boxes</label>
    <label>palette <select id="palette"><option value="default">P1</option><option value="p2">P2</option></select></label>
    <label>zoom <select id="zoom"><option value="1">game size</option><option value="1.6" selected>1.6x</option><option value="2.4">2.4x</option></select></label>
  </div>
</header>
<div id="stage"><div id="info">loading…</div></div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
<script type="module">
// Plays every Samurai action from samurai.moves.js with the same sampling rules as game/src/animator.js
// (held keys, end-of-hold tween + ease, cross-fade on action change, walk keys blended by distance walked).
import { mul, T, ap, solve, anchor, blendPoses, springsOf } from '../shinobi/rig_runtime.js';
import { SAMURAI as S } from './samurai.moves.js';

const $ = (id) => document.getElementById(id);
const stageEl = $('stage');
const CENTER = 520;
let app, rig, poses, byId, sprites = {}, gfx, fxGfx, floor;
let springState = {}, frame = 0, t0 = performance.now(), lastT = 0, simClock = null; // simClock: fixed 60 Hz clock for review captures

// ---------------------------------------------------------------- sampling (mirrors game/src/animator.js)
const EASE = { linear: (t) => t, in: (t) => t * t, out: (t) => 1 - (1 - t) * (1 - t), inout: (t) => (t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t)), smooth: (t) => t * t * (3 - 2 * t) };
const total = (frames) => frames.reduce((s, f) => s + f.hold, 0);
function sample(frames, t, loop = false) {
  const tot = total(frames);
  t = loop ? ((t % tot) + tot) % tot : Math.max(0, Math.min(tot - 1, t));
  let acc = 0, i = 0;
  while (i < frames.length - 1 && t >= acc + frames[i].hold) acc += frames[i++].hold;
  const fr = frames[i], lt = t - acc, next = frames[i + 1] || (loop ? frames[0] : null);
  const a = poses[fr.pose];
  if (!next || fr.tween === 0) return a;
  const L = Math.min(fr.hold, fr.tween ?? 5), start = fr.hold - L;
  if (lt < start) return a;
  return blendPoses(a, poses[next.pose], (EASE[fr.ease] || EASE.inout)((lt - start + 1) / (L + 1)));
}
const WALK = S.walk, CYCLE = WALK.steps.reduce((a, b) => a + b, 0);
const CUM = WALK.steps.reduce((acc, s) => (acc.push((acc.at(-1) || 0) + s), acc), [0]);
function walkPose(dist) {
  const d = ((dist % CYCLE) + CYCLE) % CYCLE;
  let i = 0; while (i < WALK.steps.length - 1 && d >= CUM[i + 1]) i++;
  const u = (d - CUM[i]) / WALK.steps[i];
  return blendPoses(poses[WALK.poses[(i + WALK.poses.length - 1) % WALK.poses.length]], poses[WALK.poses[i]], u);
}

// ---------------------------------------------------------------- actions
// each action: per-frame update(state) -> { pose, done?, idleLike?, box?, arc?, tint? }
const ACTIONS = {
  idle: (s) => ({ pose: sample(S.anims.idle.frames, s.t, true), idleLike: true }),
  'walk fwd': (s) => { s.walk = (s.walk || 0) + S.phys.walkF; s.x += S.phys.walkF; return { pose: walkPose(s.walk) }; },
  'walk back': (s) => { s.walk = (s.walk || 0) - S.phys.walkB; s.x -= S.phys.walkB; return { pose: walkPose(s.walk) }; },
  dash: (s) => { const a = S.anims.dash.frames; if (s.t >= a[0].hold && s.t < a[0].hold + S.phys.dashFrames) s.x += S.phys.dashV; return { pose: sample(a, s.t), done: s.t >= S.phys.dashTotal }; },
  backdash: (s) => { const a = S.anims.backdash.frames; if (s.t >= a[0].hold && s.t < a[0].hold + S.phys.backdashFrames) s.x -= S.phys.backdashV; return { pose: sample(a, s.t), done: s.t >= S.phys.backdashTotal }; },
  guard: (s) => ({ pose: sample(S.anims.guard.frames, s.t, true), idleLike: true }),
  light: (s) => attack(S.moves.light, s),
  heavy: (s) => attack(S.moves.heavy, s),
  ultimate: (s) => {
    const m = S.moves.ult;
    if (s.t < m.freeze) return { pose: sample(m.flash, s.t), tint: 0xffb0b8, freeze: true };
    const t = s.t - m.freeze;
    if (t === m.spawnAt) { const p = m.projectile; projectiles.push({ x: s.x + p.ox, life: p.life }); }
    if (t === m.frames.slice(0, 2).reduce((a, f) => a + f.hold, 0)) fireArc(m.arc, s.x);
    return { pose: sample(m.frames, t), done: t >= m.total };
  },
  hit: (s) => ({ pose: sample(S.anims.hit.frames, s.t, true), done: s.t >= 40, flash: s.t < 6 }),
  'KO + wake': (s) => {
    const down = 6 + 6 + 80;
    if (s.t < down) return { pose: sample(S.anims.down.frames, s.t), flash: s.t < 6 };
    const t = s.t - down;
    return { pose: sample(S.anims.wake.frames, t), done: t >= total(S.anims.wake.frames) };
  },
};
function attack(m, s) {
  if (s.t === m.frames[0].hold && m.arc) fireArc(m.arc, s.x);
  const active = s.t >= m.active[0] && s.t <= m.active[1];
  return { pose: sample(m.frames, s.t), done: s.t >= m.total, box: active ? m.box : null };
}
const REEL = ['idle:40', 'walk fwd:50', 'light:0', 'heavy:0', 'backdash:0', 'guard:40', 'dash:0', 'ultimate:0', 'hit:0', 'walk back:40', 'KO + wake:0'];

let state = { name: 'idle', t: 0, x: 0 }, reel = null, lastPose = null, fadeFrom = null, fadeT = 0, curPose = null, current = {};
let arcs = [], projectiles = [];
function play(name, keepX = true) {
  if (state.name !== name) { fadeFrom = lastPose; fadeT = 0; }
  state = { name, t: 0, x: keepX ? state.x : 0, walk: state.walk };
  document.querySelectorAll('#actions button').forEach((b) => b.classList.toggle('on', b.dataset.a === name || (reel && b.dataset.a === 'combo reel')));
  $('poses').value = '';
}
function fireArc(arc, x) {
  const outer = [], inner = [];
  for (let i = 0; i <= arc.samples; i++) {
    const t = i / arc.samples;
    const p = blendPoses(poses[arc.from], poses[arc.to], t);
    const sol = solve(rig, { ...p, root: { x: (p.root?.x || 0) + x, y: p.root?.y || 0 } });
    const a = anchor(rig, sol, arc.anchor), b = anchor(rig, sol, arc.inner);
    if (!a || !b) continue;
    const k = 0.45 + 0.35 * Math.sin(Math.PI * t);
    outer.push(a); inner.push([a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]);
  }
  arcs.push({ outer, inner, life: arc.life, max: arc.life });
}

// ---------------------------------------------------------------- rig + drawing
async function loadRig(palette) {
  rig = await (await fetch(palette === 'default' ? 'rig.json' : `rig_${palette}.json`, { cache: 'no-store' })).json();
  byId = Object.fromEntries(rig.parts.map((p) => [p.id, p]));
  springState = {};
  app.stage.removeChildren();
  const root = new PIXI.Container();
  root.sortableChildren = true;
  app.stage.addChild(root);
  sprites = {};
  await Promise.all(rig.parts.map(async (p) => {
    const tex = await PIXI.Assets.load({ src: p.file, data: { resolution: 2 } });
    const s = new PIXI.Sprite(tex);
    s.zIndex = p.zIndex;
    sprites[p.id] = s;
    root.addChild(s);
  }));
  floor = new PIXI.Graphics(); floor.zIndex = -1; root.addChild(floor); // the floor is drawn at the rig's ground line
  gfx = new PIXI.Graphics(); gfx.zIndex = 1e6; root.addChild(gfx);
  fxGfx = new PIXI.Graphics(); fxGfx.zIndex = 1e6 + 1; root.addChild(fxGfx);
}
function stageMatrix() {
  const W = app.screen.width, H = app.screen.height;
  const s = rig.recommendedScale * +$('zoom').value;
  const sx = $('mirror').checked ? -s : s;
  return [sx, 0, 0, s, W / 2 - sx * CENTER, H * 0.8 - s * rig.groundY]; // ground on the painted floor line (80%)
}
function draw(sol, tint) {
  const M = stageMatrix();
  for (const p of rig.parts) {
    const s = sprites[p.id];
    s.visible = !!sol.visible[p.id];
    if (!s.visible) continue;
    s.zIndex = sol.zOverride[p.id] ?? p.zIndex;
    s.tint = tint;
    const m = mul(M, mul(sol.W[p.id], T(p.offset.x, p.offset.y)));
    const kx = p.size.w / s.texture.width, ky = p.size.h / s.texture.height;
    s.setFromMatrix(new PIXI.Matrix(m[0] * kx, m[1] * kx, m[2] * ky, m[3] * ky, m[4], m[5]));
  }
  const gy = ap(M, 0, rig.groundY)[1];
  floor.clear().rect(0, gy, app.screen.width, app.screen.height - gy).fill(0xd6bd8a).rect(0, gy, app.screen.width, 3).fill(0xa88a55);
  gfx.clear();
  if ($('pivots').checked) {
    const SP = springsOf(rig);
    for (const p of rig.parts) {
      if (!sol.visible[p.id] || !sol.W[p.id]) continue;
      const w = ap(M, ...ap(sol.W[p.id], p.pivot.x, p.pivot.y));
      const pp = p.parent && byId[p.parent];
      if (pp && sol.visible[pp.id]) { const q = ap(M, ...ap(sol.W[pp.id], pp.pivot.x, pp.pivot.y)); gfx.moveTo(q[0], q[1]).lineTo(w[0], w[1]).stroke({ width: 1.2, color: 0x00a8ff, alpha: 0.8 }); }
      gfx.circle(w[0], w[1], 3.2).fill({ color: SP[p.id] ? 0xff9a00 : 0xff2d6a });
    }
  }
}
function drawFx(x) {
  const M = stageMatrix();
  const P = (q) => ap(M, q[0], q[1]);
  const box = (b, color, alpha, ox) => {
    const a = P([CENTER + ox + b.x0, rig.groundY - b.y1]), c = P([CENTER + ox + b.x1, rig.groundY - b.y0]);
    fxGfx.rect(Math.min(a[0], c[0]), a[1], Math.abs(c[0] - a[0]), c[1] - a[1]).fill({ color, alpha }).stroke({ width: 2, color });
  };
  fxGfx.clear();
  arcs = arcs.filter((e) => e.life-- > 0);
  for (const e of arcs) {
    const a = e.life / e.max, pts = [...e.outer.map(P), ...e.inner.slice().reverse().map(P)];
    fxGfx.poly(pts.flat()).fill({ color: 0xffffff, alpha: 0.8 * a }).stroke({ width: 3, color: 0xc8243a, alpha: a });
  }
  const pr = S.moves.ult.projectile;
  projectiles = projectiles.filter((p) => {
    if (p.life-- <= 0) return false;
    if (!current.freeze) p.x += pr.vx;
    const cx = CENTER + p.x, mid = rig.groundY - pr.h, top = mid - pr.hgt / 2, bot = mid + pr.hgt / 2, w = pr.w * 1.6;
    const q = (px, py) => P([px, py]);
    const pts = []; // crescent: outer bulge forward, inner bulge less
    for (let i = 0; i <= 16; i++) { const t = i / 16, y = top + (bot - top) * t; pts.push(q(cx - w * 0.2 + Math.sin(Math.PI * t) * w * 0.75, y)); }
    for (let i = 16; i >= 0; i--) { const t = i / 16, y = top + (bot - top) * t; pts.push(q(cx - w * 0.2 + Math.sin(Math.PI * t) * w * 0.25, y)); }
    fxGfx.poly(pts.flat()).fill({ color: 0xc8243a, alpha: 0.85 }).stroke({ width: 3, color: 0xffffff });
    if ($('hitboxes').checked) box({ x0: -pr.w / 2, x1: pr.w / 2, y0: pr.h - pr.hgt / 2, y1: pr.h + pr.hgt / 2 }, 0xff2d6a, 0.12, p.x);
    return true;
  });
  if ($('hitboxes').checked) {
    box(S.hurt.stand, 0x1d6fd8, 0.05, x);
    if (current.box) box(current.box, 0xff2d6a, 0.16, x);
  }
}

// ---------------------------------------------------------------- loop
let held = null;
function tick() {
  const now = simClock !== null ? (simClock += 1 / 60) : (performance.now() - t0) / 1000;
  const dt = Math.max(0, Math.min(1 / 20, now - lastT));
  lastT = now;
  frame++;
  let pose;
  if ($('poses').value) { pose = poses[$('poses').value]; current = { idleLike: true }; }
  else {
    current = ACTIONS[state.name](state);
    state.t++;
    if (Math.abs(state.x) > 900 && state.name.startsWith('walk')) state.x = -Math.sign(state.x) * 600;
    if (reel && (current.done || (reel.hold && state.t >= reel.hold))) nextReel();
    else if (current.done) play('idle');
    pose = current.pose;
    if (fadeFrom && fadeT < 5) { fadeT++; pose = blendPoses(fadeFrom, pose, EASE.out(fadeT / 6)); }
  }
  lastPose = pose;
  const x = $('poses').value ? 0 : state.x;
  const solved = solve(rig, { ...pose, root: { x: (pose.root?.x || 0) + x, y: pose.root?.y || 0 } }, { time: now, dt, idle: !!current.idleLike, stress: $('stress').checked, springs: $('springs').checked ? springState : null });
  if (!$('stepped').checked || frame % 3 === 0 || !held) { held = solved; draw(solved, current.tint || (current.flash ? 0xff8a8a : 0xffffff)); }
  drawFx(x);
  const k = rig.recommendedScale * +$('zoom').value;
  $('info').textContent = `${$('poses').value || state.name} f${state.t}  |  ${rig.parts.length} parts  |  scale ${k.toFixed(3)}  |  ~${Math.round(rig.height * k)} px tall`;
}
function nextReel() {
  const [name, hold] = REEL[reel.i % REEL.length].split(':');
  reel.i++; reel.hold = +hold || 0;
  play(name);
}

(async () => {
  app = new PIXI.Application();
  await app.init({ resizeTo: stageEl, backgroundAlpha: 0, antialias: true, resolution: window.devicePixelRatio || 1, autoDensity: true });
  stageEl.prepend(app.canvas);
  poses = await (await fetch('poses.json', { cache: 'no-store' })).json();
  await loadRig('default');
  for (const name of Object.keys(poses).filter((n) => !n.startsWith('_'))) {
    const o = document.createElement('option'); o.value = name; o.textContent = name.replace(/_/g, ' '); $('poses').appendChild(o);
  }
  for (const name of [...Object.keys(ACTIONS), 'combo reel']) {
    const b = document.createElement('button');
    b.textContent = name; b.dataset.a = name;
    b.onclick = () => { if (name === 'combo reel') { reel = { i: 0 }; nextReel(); } else { reel = null; play(name); } };
    $('actions').appendChild(b);
  }
  $('palette').onchange = async (e) => { app.ticker.stop(); await loadRig(e.target.value); app.ticker.start(); };
  // review hooks: preview.html?action=heavy&at=18&palette=p2&zoom=1 plays an action and pauses on frame `at`
  const q = new URLSearchParams(location.search);
  if (q.get('palette')) { $('palette').value = q.get('palette'); await loadRig(q.get('palette')); }
  if (q.get('zoom')) $('zoom').value = q.get('zoom');
  play(q.get('action') || 'idle');
  if (q.has('at')) { // deterministic capture: step the simulation synchronously to frame `at`, render once, stay paused
    app.resize(); simClock = 0; lastT = 0;
    for (let i = 0; i <= +q.get('at'); i++) tick();
    app.ticker.stop(); app.render(); document.title = 'READY';
  } else app.ticker.add(tick);
  // hooks for automated screenshots / review
  window.samurai = { play, pose: (n) => { $('poses').value = n; }, pause: () => app.ticker.stop(), resume: () => app.ticker.start(), set: (id, v) => { $(id).checked = v; } };
})();
</script>
</body>
</html>
