<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shinobi Rig Test</title>
<style>
  :root { --ink: #1b1a22; --panel: #f6f2e9; --line: #cfc6b3; --accent: #a8232f; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 system-ui, sans-serif; color: var(--ink); background: #e9e4d8; }
  header { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  .group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  button { font: inherit; padding: 4px 9px; border: 1px solid var(--line); background: #fff; border-radius: 4px; cursor: pointer; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
  #stage { position: relative; width: 100%; height: calc(100vh - 92px); min-height: 480px;
    background: linear-gradient(#bfe1f2 0%, #e9f1ea 52%, #f4e3bd 78%, #d9bf8c 78.2%, #cdb07c 100%); }
  #stage canvas { display: block; }
  #info { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: #4a4030; background: #fff8; padding: 3px 7px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>Shinobi rig test</h1>
  <div class="group"><b>anim</b><span id="anims" class="group"></span></div>
  <label><b>pose</b> <select id="poses"><option value="">(animation)</option></select></label>
  <div class="group">
    <label><input type="checkbox" id="idle" checked> idle + springs</label>
    <label><input type="checkbox" id="cycle"> cycle poses</label>
    <label><input type="checkbox" id="stepped" checked> stepped (on 3s)</label>
    <label><input type="checkbox" id="stress"> joint stress test</label>
    <label><input type="checkbox" id="mirror"> mirror</label>
    <label><input type="checkbox" id="pivots"> pivots</label>
    <label><input type="checkbox" id="hitboxes" checked> hitboxes</label>
    <label>palette <select id="palette"><option value="default">P1</option><option value="p2">P2</option></select></label>
    <label>zoom <select id="zoom"><option value="1">game size</option><option value="1.7" selected>1.7x</option><option value="2.6">2.6x</option></select></label>
  </div>
</header>
<div id="stage"><div id="info">loading…</div></div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
<script type="module">
import { mul, T, R, ap, solve, anchor, blendPoses, SPRINGS } from './rig_runtime.js';

const $ = (id) => document.getElementById(id);
const stageEl = $('stage');
let app, rig, poses, anims, byId, sprites = {}, gfx, fxGfx, fxLayer, poseName = 'neutral', pose = {};
let anim = null, fx = [], projectiles = [], flash = 0;
let springState = {};
let frame = 0, t0 = performance.now(), lastT = 0, cycleIdx = 0, cycleHold = 0, timeOverride = null;

async function loadRig(palette) {
  rig = await (await fetch(palette === 'default' ? 'rig.json' : `rig_${palette}.json`)).json();
  byId = Object.fromEntries(rig.parts.map((p) => [p.id, p]));
  springState = {};
  app.stage.removeChildren();
  const root = new PIXI.Container();
  root.sortableChildren = true;
  app.stage.addChild(root);
  sprites = {};
  await Promise.all(rig.parts.map(async (p) => {
    const tex = await PIXI.Assets.load({ src: p.file, data: { resolution: 2 } });
    const s = new PIXI.Sprite(tex);
    s.zIndex = p.zIndex;
    sprites[p.id] = s;
    root.addChild(s);
  }));
  gfx = new PIXI.Graphics();
  gfx.zIndex = 1e6;
  root.addChild(gfx);
  fxGfx = new PIXI.Graphics();
  fxGfx.zIndex = 1e6 + 1;
  root.addChild(fxGfx);
  fxLayer = new PIXI.Container();
  fxLayer.zIndex = 1e6 + 2;
  root.addChild(fxLayer);
}

function setPose(name) {
  anim = null;
  poseName = name;
  pose = poses[name] || {};
  $('poses').value = name;
  document.querySelectorAll('#anims button').forEach((b) => b.classList.remove('on'));
}

function stageMatrix() {
  const W = app.screen.width, H = app.screen.height;
  const s = rig.recommendedScale * +$('zoom').value;
  const cx = 520; // character centre line in master units
  const sx = $('mirror').checked ? -s : s;
  return [sx, 0, 0, s, W / 2 - sx * cx, H * 0.93 - s * rig.groundY];
}

function draw(sol) {
  const S = stageMatrix();
  for (const p of rig.parts) {
    const s = sprites[p.id];
    s.visible = !!sol.visible[p.id];
    if (!s.visible) continue;
    s.zIndex = sol.zOverride[p.id] ?? p.zIndex;
    const m = mul(S, mul(sol.W[p.id], T(p.offset.x, p.offset.y)));
    // the texture's logical size equals the part size, so this maps 1 texture unit -> 1 master unit
    const kx = p.size.w / s.texture.width, ky = p.size.h / s.texture.height;
    s.setFromMatrix(new PIXI.Matrix(m[0] * kx, m[1] * kx, m[2] * ky, m[3] * ky, m[4], m[5]));
  }
  gfx.clear();
  if ($('pivots').checked) {
    for (const p of rig.parts) {
      if (!sol.visible[p.id] || !sol.W[p.id]) continue;
      const w = ap(S, ...ap(sol.W[p.id], p.pivot.x, p.pivot.y));
      const pp = p.parent && byId[p.parent];
      if (pp && sol.visible[pp.id]) {
        const q = ap(S, ...ap(sol.W[pp.id], pp.pivot.x, pp.pivot.y));
        gfx.moveTo(q[0], q[1]).lineTo(w[0], w[1]).stroke({ width: 1.2, color: 0x00a8ff, alpha: 0.8 });
      }
      gfx.circle(w[0], w[1], 3.2).fill({ color: SPRINGS[p.id] ? 0xff9a00 : 0xff2d6a });
    }
  }
}

// ---------------------------------------------------------------- animation playback (stepped holds @60fps)
const withRoot = (p, dx) => ({ ...p, root: { x: (p.root?.x || 0) + dx, y: p.root?.y || 0 } });
const WRAP = 330;
function playAnim(name) {
  anim = { name, def: anims[name], i: 0, t: 0, dx: anims[name].startX || 0 };
  fx = []; projectiles.forEach((p) => p.s.destroy()); projectiles = [];
  poseName = name;
  $('poses').value = '';
  document.querySelectorAll('#anims button').forEach((b) => b.classList.toggle('on', b.dataset.anim === name));
  enterFrame();
}
function curRootX() { return anim.def.loop ? ((anim.dx + WRAP) % (2 * WRAP) + 2 * WRAP) % (2 * WRAP) - WRAP : anim.dx; }
function enterFrame() {
  const fr = anim.def.frames[anim.i];
  anim.dx += fr.step || 0; // stepped root motion: lands with the key so planted feet don't slide
  pose = withRoot(poses[fr.pose], curRootX());
  for (const ev of fr.events || []) fireEvent(ev, fr);
}
function fireEvent(ev, fr) {
  const dx = curRootX();
  if (ev.type === 'hitbox') fx.push({ kind: 'hitbox', anchor: ev.anchor, r: ev.radius, life: fr.hold });
  if (ev.type === 'flash') flash = ev.frames;
  if (ev.type === 'slashArc') {
    const outer = [], inner = [];
    for (let i = 0; i <= ev.samples; i++) {
      const t = i / ev.samples;
      const sol = solve(rig, withRoot(blendPoses(poses[ev.from], poses[ev.to], t), dx));
      const a = anchor(rig, sol, ev.anchor), b = anchor(rig, sol, ev.inner);
      if (!a || !b) continue;
      const k = 0.45 + 0.35 * Math.sin(Math.PI * t);
      outer.push(a); inner.push([a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]);
    }
    fx.push({ kind: 'arc', outer, inner, life: ev.life, max: ev.life });
  }
  if (ev.type === 'spawn') {
    const sol = solve(rig, pose);
    const a = anchor(rig, sol, ev.anchor), it = byId[ev.item];
    if (!a || !it) return;
    const s = new PIXI.Sprite(sprites[it.id].texture);
    fxLayer.addChild(s);
    projectiles.push({ s, it, pos: [...a], vel: [...ev.velocity], life: ev.life });
  }
}
function stepAnim() {
  if (!anim) return;
  const frames = anim.def.frames, fr = frames[anim.i];
  anim.dx += fr.dx || 0;
  if (++anim.t >= fr.hold) {
    anim.t = 0;
    if (anim.i + 1 < frames.length) { anim.i++; enterFrame(); }
    else if (anim.def.loop) { anim.i = 0; enterFrame(); }
    else anim.t = fr.hold; // hold the last frame
  }
  pose = withRoot(poses[frames[anim.i].pose], curRootX());
}
function drawFx(sol) {
  const S = stageMatrix();
  const P = (p) => ap(S, p[0], p[1]);
  fxGfx.clear();
  fx = fx.filter((e) => e.life-- > 0);
  for (const e of fx) {
    if (e.kind === 'arc') {
      const a = e.life / e.max, pts = [...e.outer.map(P), ...e.inner.slice().reverse().map(P)];
      fxGfx.poly(pts.flat()).fill({ color: 0xffffff, alpha: 0.8 * a }).stroke({ width: 3, color: 0xd6464e, alpha: a });
    }
    if (e.kind === 'hitbox' && $('hitboxes').checked) {
      const c = anchor(rig, sol, e.anchor);
      if (c) { const q = P(c); fxGfx.circle(q[0], q[1], e.r * Math.abs(S[0])).fill({ color: 0xff2d6a, alpha: 0.15 }).stroke({ width: 2, color: 0xff2d6a }); }
    }
  }
  projectiles = projectiles.filter((pr) => {
    if (pr.life-- <= 0) { pr.s.destroy(); return false; }
    pr.pos[0] += pr.vel[0]; pr.pos[1] += pr.vel[1];
    const ang = (Math.atan2(pr.vel[1], pr.vel[0]) * 180) / Math.PI - pr.it.grip.axisDeg;
    const m = mul(S, mul(mul(mul(T(pr.pos[0], pr.pos[1]), R(ang)), T(-pr.it.grip.x, -pr.it.grip.y)), T(pr.it.offset.x, pr.it.offset.y)));
    const kx = pr.it.size.w / pr.s.texture.width, ky = pr.it.size.h / pr.s.texture.height;
    pr.s.setFromMatrix(new PIXI.Matrix(m[0] * kx, m[1] * kx, m[2] * ky, m[3] * ky, m[4], m[5]));
    return true;
  });
  const tint = flash-- > 0 ? 0xff8a8a : 0xffffff;
  for (const s of Object.values(sprites)) s.tint = tint;
}

let held = null;
function tick() {
  const now = timeOverride ?? (performance.now() - t0) / 1000;
  const dt = Math.max(0, Math.min(1 / 20, now - lastT));
  lastT = now;
  frame++;
  if ($('cycle').checked && ++cycleHold > 36) {
    cycleHold = 0;
    const names = Object.keys(poses).filter((n) => !n.startsWith('_'));
    cycleIdx = (cycleIdx + 1) % names.length;
    setPose(names[cycleIdx]);
  }
  stepAnim();
  const idle = $('idle').checked;
  const sol = solve(rig, pose, { time: now, dt, idle, stress: $('stress').checked, springs: idle ? springState : null });
  // stepped presentation: physics runs every frame, the picture updates on 3s (anime "held" frames)
  if (!$('stepped').checked || frame % 3 === 0 || !held) { held = sol; draw(sol); }
  drawFx(held);
  const k = rig.recommendedScale * +$('zoom').value;
  $('info').textContent = `pose: ${poseName}  |  ${rig.parts.length} parts  |  scale ${k.toFixed(3)}  |  ~${Math.round(rig.height * k)} px tall`;
}

(async () => {
  app = new PIXI.Application();
  await app.init({ resizeTo: stageEl, backgroundAlpha: 0, antialias: true, resolution: window.devicePixelRatio || 1, autoDensity: true });
  stageEl.prepend(app.canvas);
  poses = await (await fetch('poses.json')).json();
  anims = await (await fetch('animations.json')).json();
  await loadRig('default');
  for (const name of Object.keys(poses).filter((n) => !n.startsWith('_'))) {
    const o = document.createElement('option');
    o.value = name; o.textContent = name.replace(/_/g, ' ');
    $('poses').appendChild(o);
  }
  $('poses').onchange = (e) => { $('cycle').checked = false; if (e.target.value) setPose(e.target.value); };
  for (const name of Object.keys(anims).filter((n) => !n.startsWith('_'))) {
    const b = document.createElement('button');
    b.textContent = name.replace(/_/g, ' ');
    b.dataset.anim = name;
    b.onclick = () => { $('cycle').checked = false; playAnim(name); };
    $('anims').appendChild(b);
  }
  playAnim('idle');
  $('palette').onchange = async (e) => { app.ticker.stop(); await loadRig(e.target.value); app.ticker.start(); };
  app.ticker.add(tick);
  // hooks for automated screenshots / review
  window.shinobi = { setPose, playAnim, state: () => anim && { name: anim.name, i: anim.i, t: anim.t }, pause: () => app.ticker.stop(), resume: () => app.ticker.start(), set: (id, v) => { $(id).checked = v; }, freezeAt: (t) => { timeOverride = t; }, unfreeze: () => { timeOverride = null; } };
})();
</script>
</body>
</html>
